spring:
  # 导入根目录 .env 文件（本地开发用），文件不存在时忽略（optional）
  # 运行环境的真实环境变量优先级高于 .env 文件，docker 部署不受影响
  config:
    import: optional:file:./.env[.properties], optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/erp_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: erp
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      location: ${user.dir}/uploads/tmp

mybatis:
  mapper-locations: classpath:mapper/*.xml
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ai:
  # API key 从环境变量 AI_API_KEY 或根目录 .env 文件读取，禁止硬编码
  api-key: ${AI_API_KEY:}
  model: deepseek-v4-flash
  api-url: https://api.deepseek.com/chat/completions